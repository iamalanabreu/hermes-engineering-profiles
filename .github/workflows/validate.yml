name: Validate engineering distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development parser
        run: python -m pip install -r requirements-dev.txt
      - name: Verify generated copies
        run: python scripts/build_distributions.py
      - name: Validate contracts
        run: python scripts/validate_distributions.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Run original Architect regression tests
        run: python -m unittest discover -s shared-skills/agent-folder-architect/tests -v
      - name: Validate evaluation corpus (not model behavior)
        run: python scripts/check_evals.py
      - name: Exercise deterministic packaging
        run: python scripts/package_release.py --out dist
